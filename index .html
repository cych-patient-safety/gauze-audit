<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分娩室數紗作業稽核系統</title>
<style>
:root{
  --bg:#f2f5f7;--surface:#fff;--ink:#17262e;--muted:#5b6b74;--line:#d3dce1;
  --accent:#0f5e73;--accent-ink:#fff;--ok:#1b7a4b;--ok-bg:#e3f3ea;--bad:#b3382c;--bad-bg:#fbe7e4;--na:#5b6b74;--na-bg:#e9eef1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11191d;--surface:#192329;--ink:#e6eef1;--muted:#9fb0b8;--line:#2d3b43;
  --accent:#5cc0d8;--accent-ink:#06222b;--ok:#6fd39b;--ok-bg:#16352a;--bad:#ff9a8c;--bad-bg:#3d1f1b;--na:#9fb0b8;--na-bg:#212d33;}}
:root[data-theme="dark"]{
  --bg:#11191d;--surface:#192329;--ink:#e6eef1;--muted:#9fb0b8;--line:#2d3b43;
  --accent:#5cc0d8;--accent-ink:#06222b;--ok:#6fd39b;--ok-bg:#16352a;--bad:#ff9a8c;--bad-bg:#3d1f1b;--na:#9fb0b8;--na-bg:#212d33;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
header{padding:8px 0 20px}
.hd{display:flex;align-items:center;gap:16px}
.logo{height:64px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
header p{margin:0;color:var(--muted);font-size:14px}
h1{margin:4px 0 0;font-size:26px;line-height:1.3;letter-spacing:.02em}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h2{margin:0 0 14px;font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=date],input[type=time],textarea{min-width:0;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--bg)}
.chips input{accent-color:var(--accent);width:18px;height:18px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0;padding-top:0}
.item .q{margin:0 0 10px;font-weight:500}
.item .q b{color:var(--accent);margin-right:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{position:relative;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:10px 4px;cursor:pointer;font-weight:500;background:var(--bg);user-select:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.seg label:has(input[value=ok]:checked){background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg label:has(input[value=bad]:checked){background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg label:has(input[value=na]:checked){background:var(--na-bg);border-color:var(--na);color:var(--na)}
.note{display:none;margin-top:10px}
.item.bad .note{display:block}
.item.missing .q{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:8px;padding:10px 4px}
.stats strong{display:block;font-size:24px;line-height:1.2}
.stats span{font-size:13px;color:var(--muted)}
.rate strong{color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.sigs{grid-template-columns:1fr}}
.pad{position:relative;border:1.5px dashed var(--line);border-radius:8px;background:#fff;height:150px;overflow:hidden}
.pad canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa7ae;font-size:14px;pointer-events:none}
.pad.signed .ph{display:none}
.pad.missing{border-color:var(--bad)}
.sigfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px}
.link{background:none;border:0;color:var(--accent);padding:4px 6px;font-weight:600}
.submitbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.submitbar div{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.submitbar span{flex:1;font-size:14px;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;padding:12px 22px;font-weight:700}
.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);padding:12px 18px;font-weight:700}
@media (max-width:480px){.submitbar div{flex-wrap:wrap}.submitbar span{flex-basis:100%}.submitbar button{flex:1}}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px 6px;font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.lh h2{margin:0}
.rec{border-top:1px solid var(--line);padding:10px 0}
.rec summary{display:grid;grid-template-columns:1.5fr 1fr 64px;gap:8px;cursor:pointer}
.rb{padding:10px 0 4px;font-size:15px}
.rb p{margin:4px 0}
.rb img{max-width:200px;background:#fff;border:1px solid var(--line);border-radius:6px}
.bar{height:10px;border-radius:5px;background:var(--na-bg);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--ok)}
#done{display:none}
#done img{max-width:100%;background:#fff;border:1px solid var(--line);border-radius:8px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted)}dd{margin:0}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:600}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-na{background:var(--na-bg);color:var(--na)}
</style>
</head>

<script>
const ITEMS=[
"分娩前雙人共同數紗，並重複清點二次",
"使用後紗布放置於數紗盒",
"新增紗布時雙人共同清點並確認累計總數",
"阻力紗布使用後確認已取出",
"分娩後紗布整理及分類正確",
"分娩後雙人共同數紗，確認前後數量一致",
"NIS完整記錄數紗人員、紗布名稱及數量",
"紗布短少時依規定處理、記錄及通報"];
const LBL={ok:"符合",bad:"不符合",na:"不適用"};
const $=s=>document.querySelector(s);
const box=$("#items");
ITEMS.forEach((t,i)=>{
  const n=i+1;
  box.insertAdjacentHTML("beforeend",
  `<div class="item" id="it${n}"><p class="q"><b>${n}.</b>${t}</p>
   <div class="seg" role="radiogroup" aria-label="${t}">
    <label><input type="radio" name="r${n}" value="ok">符合</label>
    <label><input type="radio" name="r${n}" value="bad">不符合</label>
    <label><input type="radio" name="r${n}" value="na">不適用</label>
   </div>
   <div class="note"><textarea id="n${n}" placeholder="改善說明（選填）"></textarea></div></div>`);
});
const val=n=>{const c=document.querySelector(`input[name=r${n}]:checked`);return c?c.value:null};
function stats(){
  let ok=0,bad=0,na=0;
  ITEMS.forEach((_,i)=>{const v=val(i+1);if(v==="ok")ok++;else if(v==="bad")bad++;else if(v==="na")na++;
    const it=$("#it"+(i+1));it.classList.toggle("bad",v==="bad");if(v)it.classList.remove("missing");});
  $("#sOk").textContent=ok;$("#sBad").textContent=bad;$("#sNa").textContent=na;
  const d=ok+bad;$("#sRate").textContent=d?Math.round(ok/d*1000)/10+"%":"－";
  return{ok,bad,na,rate:d?Math.round(ok/d*1000)/10:null};
}
box.addEventListener("change",stats);

/* signature pads */
const pads={};
function initPad(k){
  const wrap=$("#pad"+k),cv=wrap.querySelector("canvas"),ctx=cv.getContext("2d");
  cv.width=800;cv.height=300;ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b1f2a";
  let draw=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);draw=true;last=pos(e);
    ctx.beginPath();ctx.arc(last.x,last.y,2.5,0,7);ctx.fillStyle="#0b1f2a";ctx.fill();mark();});
  cv.addEventListener("pointermove",e=>{if(!draw)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  const end=()=>{draw=false};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  function mark(){if(!pads[k].signed){pads[k].signed=true;pads[k].time=new Date();wrap.classList.add("signed");wrap.classList.remove("missing");
    $("#t"+k).textContent="簽名時間 "+stamp(pads[k].time);}}
  pads[k]={cv,ctx,signed:false,time:null,clear(){ctx.clearRect(0,0,cv.width,cv.height);this.signed=false;this.time=null;wrap.classList.remove("signed");$("#t"+k).textContent="尚未簽名";}};
}
const pad2=n=>String(n).padStart(2,"0");
const stamp=d=>`${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
initPad(1);initPad(2);
document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>pads[b.dataset.clear].clear());

/* submit */
$("#submit").onclick=()=>{
  const errs=[];

const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function buildPages(){
  const W=1240,H=1754,M=90,CW=W-2*M,pages=[];let cv,c,y;
  const newPage=()=>{cv=document.createElement("canvas");cv.width=W;cv.height=H;c=cv.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,W,H);c.textBaseline="top";pages.push(cv);y=M;};
  const ensure=h=>{if(y+h>H-M-30)newPage();};
  const wrapT=(t,w,f)=>{c.font=f;const out=[];String(t).split("\n").forEach(p=>{let l="";for(const ch of p){if(c.measureText(l+ch).width>w&&l){out.push(l);l=ch}else l+=ch}out.push(l)});return out;};
  const para=(t,o={})=>{const{size=26,x=M,w=CW,color="#17262e",weight="400",gap=10}=o;const f=`${weight} ${size}px ${FONT}`;const lh=size*1.55;wrapT(t,w,f).forEach(l=>{ensure(lh);c.font=f;c.fillStyle=color;c.textAlign="left";c.fillText(l,x,y);y+=lh});y+=gap;};
  const rule=()=>{c.fillStyle="#d3dce1";c.fillRect(M,y,CW,2);y+=18;};
  const head=t=>{ensure(90);y+=14;para(t,{size:32,weight:"700",color:"#0f5e73",gap:2});rule();};
  newPage();
  const lg=$("#logo"),lh2=100,lw2=lg.naturalWidth/lg.naturalHeight*lh2,top0=y;
  try{c.drawImage(lg,M,top0,lw2,lh2)}catch(e){}
  const tx=M+lw2+30;
  para("醫療品質部・病人安全科",{size:24,x:tx,w:CW-lw2-30,color:"#5b6b74",gap:0});
  para("分娩室數紗作業稽核紀錄",{size:46,x:tx,w:CW-lw2-30,weight:"700",gap:8});
  y=Math.max(y,top0+lh2+14);rule();
  const s=stats();
  const methods=[...document.querySelectorAll("input[name=method]:checked")].map(x=>x.value).join("、")||"未選擇";
  const birth=document.querySelector("input[name=birth]:checked");
  head("一、基本資料");
  [["稽核日期時間",$("#date").value.replace(/-/g,"/")+" "+$("#time").value],["稽核人員",$("#auditor").value.trim()||"未填"],["稽核方式",methods],["生產方式",birth?birth.value:"未選擇"]].forEach(([k,v])=>{
    ensure(44);c.font=`400 26px ${FONT}`;c.fillStyle="#5b6b74";c.textAlign="left";c.fillText(k,M,y);c.fillStyle="#17262e";c.fillText(v,M+190,y);y+=44;});
  head("二、數紗作業稽核");
  const COL={ok:"#1b7a4b",bad:"#b3382c",na:"#5b6b74"};
  ITEMS.forEach((t,i)=>{
    const n=i+1,v=val(n),f=`400 26px ${FONT}`,lh=40;
    const ls=wrapT(`${n}. ${t}`,CW-200,f);ensure(ls.length*lh+16);
    const top=y;ls.forEach(l=>{c.font=f;c.fillStyle="#17262e";c.textAlign="left";c.fillText(l,M,y);y+=lh});
    c.font=`700 26px ${FONT}`;c.fillStyle=v?COL[v]:"#999";c.textAlign="right";c.fillText(v?LBL[v]:"未填",W-M,top);c.textAlign="left";
    const note=$("#n"+n).value.trim();if(v==="bad"&&note)para("改善說明："+note,{size:23,x:M+30,w:CW-30,color:"#b3382c",gap:2});
    y+=12;});
  head("三、稽核結果");
  para(`符合 ${s.ok} 項　不符合 ${s.bad} 項　不適用 ${s.na} 項　符合率 ${s.rate===null?"－":s.rate+"%"}`,{weight:"600"});
  para("稽核建議",{weight:"600",gap:2});
  para($("#advice").value.trim()||"（無）",{x:M+30,w:CW-30});
  head("四、電子簽名");
  ensure(310);
  const bw=(CW-40)/2;
  [1,2].forEach(k=>{const x=M+(k-1)*(bw+40);
    c.font=`600 24px ${FONT}`;c.fillStyle="#17262e";c.textAlign="left";c.fillText(k===1?"稽核人員簽名":"單位主管簽名",x,y);
    c.strokeStyle="#9aa7ae";c.lineWidth=2;c.strokeRect(x,y+40,bw,200);
    if(pads[k].signed){const r=Math.min((bw-20)/800,180/300);c.drawImage(pads[k].cv,x+10,y+50,800*r,300*r);}
    c.font=`400 20px ${FONT}`;c.fillStyle="#5b6b74";c.fillText(pads[k].signed?"簽名時間 "+stamp(pads[k].time):"（未簽名）",x,y+252);});
  y+=300;
  pages.forEach((p,i)=>{const g=p.getContext("2d");g.font=`400 20px ${FONT}`;g.fillStyle="#5b6b74";g.textAlign="center";g.textBaseline="top";g.fillText(`第 ${i+1} / ${pages.length} 頁`,W/2,H-70);});
  return pages;
}
function toPDF(pages){
  const enc=new TextEncoder(),chunks=[],offs=[];let pos=0;
  const add=x=>{const b=typeof x==="string"?enc.encode(x):x;chunks.push(b);pos+=b.length};
  const obj=(n,body)=>{offs[n]=pos;add(`${n} 0 obj\n${body}\nendobj\n`)};
  add("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] /Count ${pages.length} >>`);
  pages.forEach((p,i)=>{
    const pg=3+3*i,ct=4+3*i,im=5+3*i;
    const bin=atob(p.toDataURL("image/jpeg",0.92).split(",")[1]);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    const st="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(ct,`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);
    offs[im]=pos;add(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.width} /Height ${p.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${u.length} >>\nstream\n`);add(u);add("\nendstream\nendobj\n");
  });
  const n=3+3*pages.length,xr=pos;let x=`xref\n0 ${n}\n0000000000 65535 f \n`;
  for(let k=1;k<n;k++)x+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
  add(x+`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks,{type:"application/pdf"});
}
const DL={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}};
$("#pdf").onclick=async()=>{
  const m=$("#msg");m.style.color="";
  if(!DL){m.textContent="目前環境無法匯出 PDF";return;}
  try{
    const blob=toPDF(buildPages());
    await DL.save({filename:`數紗稽核_${$("#date").value||"未填日期"}.pdf`,data:blob});
    m.textContent="PDF 已匯出";
  }catch(e){
    m.style.color=e&&e.code==="declined"?"":"var(--bad)";
    m.textContent=e&&e.code==="declined"?"已取消匯出":"匯出失敗，請稍後再試";
  }
};

const KEY="gauze_audits_v1";
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
let DB=true,RECS=[];
const ESC=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtR=r=>(r.date||"").replace(/-/g,"/")+" "+(r.time||"");

function autoDT(){const d=new Date();$("#date").value=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());$("#time").value=pad2(d.getHours())+":"+pad2(d.getMinutes());}

async function saveRec(){
  const m=$("#msg");const s=stats();
  const rec={ts:new Date().toISOString(),date:$("#date").value,time:$("#time").value,auditor:$("#auditor").value.trim(),
    method:[...document.querySelectorAll("input[name=method]:checked")].map(x=>x.value),
    birth:document.querySelector("input[name=birth]:checked").value,
    items:ITEMS.map((_,i)=>val(i+1)),notes:ITEMS.map((_,i)=>$("#n"+(i+1)).value.trim()),
    ok:s.ok,bad:s.bad,na:s.na,rate:s.rate,advice:$("#advice").value.trim(),
    sig1:small(1),sig2:pads[2].signed?small(2):"",sigTime1:pads[1].time.toISOString(),sigTime2:pads[2].time?pads[2].time.toISOString():""};
  try{const arr=loadAll();rec.id=String(Date.now());arr.unshift(rec);localStorage.setItem(KEY,JSON.stringify(arr));RECS=arr;renderList();renderStats();m.style.color="";m.textContent="已儲存在這台裝置的瀏覽器中";
    if(cfg().url){m.textContent="已儲存，正在同步到 Google 試算表…";const ok=await syncOne(rec);try{localStorage.setItem(KEY,JSON.stringify(RECS))}catch(x){}renderList();m.style.color=ok?"":"var(--bad)";m.textContent=ok?"已儲存並同步到 Google 試算表":"已儲存在本機，但同步失敗；可到「稽核紀錄」按「補傳」";}}
  catch(e){m.style.color="var(--bad)";m.textContent="儲存失敗（瀏覽器儲存空間不足或被停用），請按「匯出 PDF」留存";$("#submit").disabled=false;}

    <p>${r.sig1?`<img alt="稽核人員簽名" src="${ESC(r.sig1)}"> `:""}${r.sig2?`<img alt="單位主管簽名" src="${ESC(r.sig2)}">`:""}</p></div></details>`;}).join("")+'</section>';
  $("#csv").onclick=exportCsv;const rb=$("#resync");if(rb)rb.onclick=resync;

async function exportCsv(){
  const m=$("#msg");if(!DL){alert("目前環境無法匯出檔案");return;}
  const head=["稽核日期","稽核時間","稽核人員","稽核方式","生產方式",...ITEMS.map((_,i)=>"項目"+(i+1)),"符合","不符合","不適用","符合率","稽核建議"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=RECS.map(r=>[r.date,r.time,r.auditor,(r.method||[]).join("、"),r.birth,...ITEMS.map((_,i)=>LBL[(r.items||[])[i]]||""),r.ok,r.bad,r.na,r.rate==null?"":r.rate+"%",r.advice]);
  const csv="\ufeff"+[head,...rows].map(a=>a.map(q).join(",")).join("\r\n");
  try{await DL.save({filename:"數紗稽核紀錄.csv",data:csv});}catch(e){if(!e||e.code!=="declined")alert("匯出失敗，請稍後再試");}
}
$("#vList").addEventListener("click",e=>{const id=e.target.dataset&&e.target.dataset.del;if(!id)return;
  if(!confirm("確定要刪除這筆稽核紀錄嗎？刪除後無法復原。"))return;

function renderStats(){
  const el=$("#vStats");
  if(!RECS.length){el.innerHTML='<section><h2>統計</h2><p class="hint">有稽核紀錄後，這裡會顯示符合率與各項目的狀況。</p></section>';return;}
  const pc=(o,b)=>o+b?Math.round(o/(o+b)*1000)/10:null;
  const tok=RECS.reduce((a,r)=>a+(r.ok||0),0),tbad=RECS.reduce((a,r)=>a+(r.bad||0),0);
  const per=ITEMS.map((t,i)=>{let o=0,b=0;RECS.forEach(r=>{const v=(r.items||[])[i];if(v==="ok")o++;else if(v==="bad")b++;});return{t,o,b,r:pc(o,b)};});
  const mo={};RECS.forEach(r=>{const k=(r.date||"").slice(0,7);(mo[k]=mo[k]||{o:0,b:0,n:0});mo[k].o+=r.ok||0;mo[k].b+=r.bad||0;mo[k].n++;});
  el.innerHTML=`<section><h2>整體符合率</h2><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="rate"><strong>${rt(pc(tok,tbad))}</strong><span>符合率</span></div><div><strong>${RECS.length}</strong><span>稽核份數</span></div><div><strong>${tbad}</strong><span>不符合項次</span></div></div></section>
  <section><h2>各項目符合率</h2>${per.map((p,i)=>`<div><div>${i+1}. ${ESC(p.t)}</div><div class="bar"><i style="width:${p.r==null?0:p.r}%;${p.r!=null&&p.r<80?"background:var(--bad)":""}"></i></div><small>符合率 ${rt(p.r)}　不符合 ${p.b} 次</small></div>`).join("")}<p class="hint">符合率低於 80% 的項目以紅色標示。</p></section>
  <section><h2>每月符合率</h2>${Object.keys(mo).sort().reverse().map(k=>`<p style="display:flex;justify-content:space-between;margin:6px 0"><span>${k.replace("-","/")}（${mo[k].n} 份）</span><b>${rt(pc(mo[k].o,mo[k].b))}</b></p>`).join("")}</section>`;
}
/* Google Sheet sync via Apps Script */
const CFG_KEY="gauze_sync_cfg_v1";
function cfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||"{}")}catch(e){return{}}}
function rowOf(r){const it=r.items||[],nt=r.notes||[];
  const notes=ITEMS.map((_,i)=>it[i]==="bad"&&nt[i]?(i+1)+". "+nt[i]:"").filter(Boolean).join("\n");
  return [(r.date||"").replace(/-/g,"/"),r.time||"",r.auditor||"",(r.method||[]).join("、"),r.birth||"",
    ...ITEMS.map((_,i)=>LBL[it[i]]||""),r.ok||0,r.bad||0,r.na||0,r.rate==null?"":r.rate/100,notes,r.advice||"",stamp(new Date(r.ts)),String(r.id)];}
async function post(payload){const c=cfg();
  const res=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:c.key||""},payload))});
  return res.json();}
async function syncOne(r){try{const j=await post({id:String(r.id),row:rowOf(r)});if(j&&j.ok){r.synced=true;return true;}}catch(e){}return false;}
function unsyncedBtn(){const n=cfg().url?RECS.filter(r=>!r.synced).length:0;return n?'<button type="button" class="ghost" id="resync">補傳 '+n+' 筆</button>':"";}
async function resync(){
  const b=$("#resync");if(b){b.disabled=true;b.textContent="補傳中…";}
  let ok=0,fail=0;
  for(const r of RECS.slice().reverse()){if(r.synced)continue;if(await syncOne(r))ok++;else fail++;}
  try{localStorage.setItem(KEY,JSON.stringify(RECS))}catch(x){}
  renderList();alert("補傳完成：成功 "+ok+" 筆"+(fail?"，失敗 "+fail+" 筆（請檢查設定與網路）":"。"));
}
(function(){const c=cfg();$("#cfgUrl").value=c.url||"";$("#cfgKey").value=c.key||"";
  const msg=t=>{$("#cfgMsg").textContent=t};
  $("#cfgSave").onclick=()=>{const u=$("#cfgUrl").value.trim();
    if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){msg("網址格式不正確，應該是 https://script.google.com/macros/s/…/exec");return;}
    localStorage.setItem(CFG_KEY,JSON.stringify({url:u,key:$("#cfgKey").value}));msg(u?"設定已儲存。建議按「測試連線」確認。":"已儲存（未設定同步）。");renderList();};
  $("#cfgTest").onclick=async()=>{$("#cfgSave").click();if(!cfg().url){return;}msg("測試中…");
    try{const j=await post({test:true});msg(j&&j.ok?"連線成功，密碼正確。":"連線到了，但被拒絕："+((j&&j.error)||"未知原因")+"（請檢查通關密碼）");}
    catch(e){msg("無法連線，請檢查網址、網路，以及部署時「誰可以存取」是否設為「所有人」。");}};
  $("#cfgClear").onclick=()=>{localStorage.removeItem(CFG_KEY);$("#cfgUrl").value="";$("#cfgKey").value="";msg("已清除同步設定。");renderList();};
})();
document.querySelectorAll(".tab[hidden]").forEach(b=>b.hidden=false);
RECS=loadAll();renderList();renderStats();
</script>
</body>
</html>
